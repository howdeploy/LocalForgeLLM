      <text x="648" y="348">Installed RAM, not RSS</text>
      <text x="32" y="398">Formats: APEX I-Compact / int4 / NVFP4. Different CPUs and workloads.</text>
      <text x="32" y="422">LocalForgeLLM: our logs. Colibri and FreeToken: author-reported results.</text>
