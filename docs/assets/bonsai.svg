<text x="64" y="1975" font-size="20" fill="#555555" text-anchor="start">Separate smoke checks: reasoning 26.79 tok/s; two MCP skill calls completed in a 76.93 s loop.</text>
<text x="64" y="2060" font-size="22" fill="#111111" text-anchor="start" font-weight="700">WHAT THE RESULT SUPPORTS</text>
<path d="M64 2078H1536" stroke="#cccccc" fill="none"/>
<text x="64" y="2110" font-size="20" fill="#555555" text-anchor="start">Ternary kernels reduce weight traffic; GPU cache residency avoids the host path in these profiles.</text>
<text x="64" y="2144" font-size="20" fill="#555555" text-anchor="start">Cross-model gains mix several changes. Local headroom reached 98 MiB; no universal 8 GB fit promise.</text>
<text x="64" y="2178" font-size="20" fill="#555555" text-anchor="start">Source: subscriber HTML plus local API timings. No controlled quality ranking or instant-peak claim.</text>
