<text x="64" y="1450" font-size="22" fill="#111111" text-anchor="start" font-weight="700">WHAT HELPED — AND WHAT THE DATA CANNOT ISOLATE</text>
<path d="M64 1468H1536" stroke="#cccccc" fill="none"/>
<text x="64" y="1500" font-size="20" fill="#555555" text-anchor="start">GPU: attention + 3 expert blocks + Q8 KV. CPU: experts in 27/30 blocks. 32K / 1 slot / 6 threads.</text>
<text x="64" y="1534" font-size="20" fill="#555555" text-anchor="start">RAM headroom, MTP and cache state matter. CUDA alone first measured 14.83 → 14.01 tok/s (-5.5%).</text>
<text x="64" y="1568" font-size="20" fill="#555555" text-anchor="start">Different prompts and live histories. Phase percentages are not additive; no full-32K quality test.</text>
