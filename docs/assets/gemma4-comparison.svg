<svg xmlns="http://www.w3.org/2000/svg" width="960" height="744" viewBox="0 0 960 744" role="img" aria-labelledby="title description">
  <title id="title">Gemma 4 26B-A4B: deployment results</title>
  <desc id="description">LocalForgeLLM with an APEX I-Balanced target and separate Q8 MTP head: 14.83 tokens per second on RTX 4060 8 GB, two user requests. Published references: QAT CUDA plus MTP 24.0 and QAT Vulkan about 4.9 on RTX 2070 Max-Q 8 GB; full Q8 via Ollama 45.2 on GB10 with 128 GB unified memory; FreeToken user report 179 after a local patch on RTX 4080 SUPER 16 GB. Different weights, workloads, hardware and evidence quality prevent a controlled ranking. Sources and methods: docs/benchmarks/gemma4-mtp.md.</desc>
