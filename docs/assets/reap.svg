<text x="64" y="1414" font-size="22" fill="#111111" text-anchor="start" font-weight="700">WHY THE BEST CONFIGURATION HELPS</text>
<path d="M64 1432H1536" stroke="#cccccc" fill="none"/>
<text x="64" y="1464" font-size="20" fill="#555555" text-anchor="start">Hot copies speed decode; prefill bypass limits the prompt penalty. Extra host RAM is the tradeoff.</text>
<text x="64" y="1498" font-size="20" fill="#555555" text-anchor="start">Corrected strided profiler. Sequential hot/cold fallback observed. These are not RTX 4060 rates.</text>
