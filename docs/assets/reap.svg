<text x="1536" y="52" font-size="19" fill="#555555" text-anchor="end">18 SEP 2026</text>
<text x="64" y="116" font-size="46" fill="#111111" text-anchor="start" font-weight="700">Gemma 4 / prune, rebuild, place</text>
<text x="64" y="163" font-size="21" fill="#555555" text-anchor="start">REAP124 + APEX I-Balanced. Storage and execution are separate experiments.</text>
<text x="64" y="197" font-size="21" fill="#555555" text-anchor="start">Rented RTX 4500 Ada 24 GB / Threadripper PRO 5995WX / September 12, 2026</text>
