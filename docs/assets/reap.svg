<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620" role="img" aria-labelledby="title description">
<title id="title">Gemma 4 / prune, rebuild, place</title>
<desc id="description">REAP124 + APEX I-Balanced. Storage and execution are separate experiments.. Rented RTX 4500 Ada 24 GB / Threadripper PRO 5995WX / September 12, 2026</desc>
