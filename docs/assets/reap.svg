<text x="1168.0" y="420" font-size="19" fill="#555555" text-anchor="start">RSS increased 2.43 GiB</text>
<text x="64" y="487" font-size="22" fill="#111111" text-anchor="start" font-weight="700">01 / BUILD LINEAGE</text>
<path d="M64 505H1536" stroke="#cccccc" fill="none"/>
<text x="64" y="553" font-size="28" fill="#111111" text-anchor="start" font-weight="700">Heretic BF16  →  REAP124  →  BF16 GGUF  →  fresh imatrix  →  APEX</text>
<text x="64" y="602" font-size="20" fill="#555555" text-anchor="start">30 layers / top-k stays 8 / 44,032 imatrix tokens / exact tensor recipe / native llama-quantize</text>
<text x="64" y="638" font-size="20" fill="#555555" text-anchor="start">Pruning control: 37.46 → 37.26 tok/s. Experimental quality gate; no proved &lt;=5% loss bound.</text>
<text x="64" y="723" font-size="22" fill="#111111" text-anchor="start" font-weight="700">02 / SAME REAP124 WEIGHTS — CHANGE EXPERT PLACEMENT</text>
